<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Impede que o token da URL vaze para outros sites -->
    <meta name="referrer" content="no-referrer">

    <title>Redefinir Senha</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

<script src="js/notificacoes.js?v=1"></script>
</head>

<body>

    <main class="container mt-5" style="max-width: 520px;">

        <h2 class="text-center">Redefinir senha</h2>

        <p id="textoCarregando" class="text-center text-muted">
            Verificando o link...
        </p>

        <div id="linkInvalido" class="alert alert-danger d-none">
            Este link é inválido ou expirou.
            <a href="recuperar-senha.html">Solicitar um novo link</a>
        </div>

        <form id="formRedefinir" class="d-none">

            <div class="mb-3">
                <label class="form-label" for="novaSenha">Nova senha</label>
                <input type="password" class="form-control" id="novaSenha"
                    minlength="6" maxlength="72" required autocomplete="new-password">
            </div>

            <div class="mb-3">
                <label class="form-label" for="confirmarSenha">Confirmar nova senha</label>
                <input type="password" class="form-control" id="confirmarSenha"
                    minlength="6" maxlength="72" required autocomplete="new-password">
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Salvar nova senha
            </button>

        </form>

        <div id="sucesso" class="alert alert-success d-none">
            Senha redefinida com sucesso!
            <a href="login.html">Entrar</a>
        </div>

    </main>

    <script src="js/redefinir-senha.js"></script>

</body>

</html>
